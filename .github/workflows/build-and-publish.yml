name: ph-ee-operations-web
run-name: ph-ee-operations-web-${{ github.ref_name }}-${{ github.run_number }}

on:
  push:
    branches:
      - main
      - develop
      - release/*
  pull_request:
    branches:
      - main
      - develop
      - release/*

env:
  CONTAINER_REGISTRY: ${{ vars.ACR_REGISTRY != '' && vars.ACR_REGISTRY || 'localhost' }}
  IMAGE_REPOSITORY: oneacrefund/ph-ee-operations-web
  SHOULD_PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')) }}
  IS_MAIN: ${{ github.ref == 'refs/heads/main' }}

jobs:
  Build:
    name: Build And Publish Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 18

      - name: Set image tags
        id: set-env
        shell: bash
        run: |
          VERSION_TAG=$(npm pkg get version | tr -d '"')
          DATE_TAG=$(date '+%Y.%m.%d')
          BUILD_TAG="${VERSION_TAG}.${DATE_TAG}.${{ github.run_number }}"
          FULL_IMAGE_TAGS="${CONTAINER_REGISTRY}/${IMAGE_REPOSITORY}:${BUILD_TAG}"

          echo "Version tag: ${VERSION_TAG}"
          echo "Build tag: ${BUILD_TAG}"

          if [[ "${IS_MAIN}" == "true" ]]; then
            FULL_IMAGE_TAGS="${FULL_IMAGE_TAGS}"$'\n'"${CONTAINER_REGISTRY}/${IMAGE_REPOSITORY}:${VERSION_TAG}"$'\n'"${CONTAINER_REGISTRY}/${IMAGE_REPOSITORY}:latest"
          fi

          echo "Image tags:"
          echo "${FULL_IMAGE_TAGS}"

          {
            echo "VERSION_TAG=${VERSION_TAG}"
            echo "BUILD_TAG=${BUILD_TAG}"
            echo "FULL_IMAGE_TAGS<<EOF"
            echo "${FULL_IMAGE_TAGS}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to Azure registry
        uses: docker/login-action@v3.3.0
        if: ${{ env.SHOULD_PUBLISH == 'true' }}
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ vars.ACR_PULL_USERNAME }}
          password: ${{ secrets.ACR_PULL_PASSWORD }}

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@v6.13.0
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/Dockerfile
          push: ${{ env.SHOULD_PUBLISH == 'true' }}
          tags: ${{ steps.set-env.outputs.FULL_IMAGE_TAGS }}
